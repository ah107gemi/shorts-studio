<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Studio</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo-icon">🎬</span>
                <h1 class="logo-text">Shorts Studio</h1>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="new-project">
                    <span class="nav-icon">➕</span>
                    <span class="nav-label">New Project</span>
                </a>
                <a href="#" class="nav-item" data-page="project-library">
                    <span class="nav-icon">📁</span>
                    <span class="nav-label">Project Library</span>
                </a>

                <div class="nav-divider"></div>
                <span class="nav-section-label">Production</span>

                <a href="#" class="nav-item" data-page="script-editor">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">Script Editor</span>
                </a>
                <a href="#" class="nav-item" data-page="storyboard">
                    <span class="nav-icon">🎞️</span>
                    <span class="nav-label">Storyboard</span>
                </a>
                <a href="#" class="nav-item" data-page="voiceover">
                    <span class="nav-icon">🎙️</span>
                    <span class="nav-label">Voiceover</span>
                </a>
                <a href="#" class="nav-item" data-page="assets">
                    <span class="nav-icon">🖼️</span>
                    <span class="nav-label">Assets</span>
                </a>
                <a href="#" class="nav-item" data-page="video-editor">
                    <span class="nav-icon">🎬</span>
                    <span class="nav-label">Video Editor</span>
                </a>
                <a href="#" class="nav-item" data-page="captions">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">Captions</span>
                </a>

                <div class="nav-divider"></div>
                <span class="nav-section-label">Output</span>

                <a href="#" class="nav-item" data-page="render-queue">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Render Queue</span>
                </a>
                <a href="#" class="nav-item" data-page="quality">
                    <span class="nav-icon">✅</span>
                    <span class="nav-label">Quality Control</span>
                </a>
                <a href="#" class="nav-item" data-page="export">
                    <span class="nav-icon">📤</span>
                    <span class="nav-label">Export</span>
                </a>

                <div class="nav-divider"></div>

                <a href="#" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Settings</span>
                </a>
                <a href="#" class="nav-item" data-page="logs">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Logs</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span class="version-badge">v1.0.0</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <div class="page-container" id="page-container">
                <!-- Pages render here -->
            </div>
        </main>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
